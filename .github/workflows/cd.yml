name: CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Ensure repository/name is lowercase for container tags
  IMAGE_NAME: ${{ github.repository }}/requesting-approval
  # Opt into Node.js 24 for actions that require newer Node runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-backend:
    name: Package Backend Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend directory
        id: detect-backend
        run: |
          # Try common casings for the backend folder to be robust on case-sensitive runners
          if [ -d RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval" >> "$GITHUB_ENV"
          elif [ -d requestingandapproval ]; then
            echo "BACKEND_DIR=requestingandapproval" >> "$GITHUB_ENV"
          elif [ -d RequestingAndApproval/RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval/RequestingAndApproval" >> "$GITHUB_ENV"
          else
            echo "No backend directory found at expected paths — listing repository root for debugging:" >&2
            pwd
            ls -la
            echo "Searching for common backend markers (main.py, requirements.txt, Dockerfile) up to 4 levels deep..." >&2
            candidate=$(find . -maxdepth 4 -type f \( -name main.py -o -name requirements.txt -o -name Dockerfile \) -printf "%h\n" | sort -u | head -n1)
            if [ -n "$candidate" ]; then
              candidate=${candidate#./}
              echo "Detected backend directory: $candidate" >&2
              echo "BACKEND_DIR=$candidate" >> "$GITHUB_ENV"
            else
              echo "No backend directory found" >&2
              exit 1
            fi
          fi

      - name: Create backend artifact
        run: |
          set -e
          # Use a stable git snapshot when the detected backend dir is the repository root
          if [ -z "${BACKEND_DIR}" ] || [ "${BACKEND_DIR}" = "." ]; then
            echo "BACKEND_DIR is repository root; creating artifact from commit snapshot using git archive"
            git archive --format=tar --prefix=requesting-and-approval-${{ github.sha }}/ ${{ github.sha }} | gzip > requesting-and-approval-${{ github.sha }}.tar.gz
          else
            echo "Creating tar.gz of ${BACKEND_DIR}"
            tar --warning=no-file-changed -czf requesting-and-approval-${{ github.sha }}.tar.gz "${BACKEND_DIR}"
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: requesting-and-approval-${{ github.sha }}
          path: requesting-and-approval-${{ github.sha }}.tar.gz
          if-no-files-found: error

  build-and-push-backend-image:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend directory
        id: detect-backend-build
        run: |
          if [ -d RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval" >> "$GITHUB_ENV"
          elif [ -d requestingandapproval ]; then
            echo "BACKEND_DIR=requestingandapproval" >> "$GITHUB_ENV"
          elif [ -d RequestingAndApproval/RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval/RequestingAndApproval" >> "$GITHUB_ENV"
          else
            echo "No backend directory found at expected paths — listing repository root for debugging:" >&2
            pwd
            ls -la
            echo "Searching for common backend markers (main.py, requirements.txt, Dockerfile) up to 4 levels deep..." >&2
            candidate=$(find . -maxdepth 4 -type f \( -name main.py -o -name requirements.txt -o -name Dockerfile \) -printf "%h\n" | sort -u | head -n1)
            if [ -n "$candidate" ]; then
              candidate=${candidate#./}
              echo "Detected backend directory: $candidate" >&2
              echo "BACKEND_DIR=$candidate" >> "$GITHUB_ENV"
            else
              echo "No backend directory found" >&2
              exit 1
            fi
          fi

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}/requesting-approval' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.BACKEND_DIR }}
          file: ./${{ env.BACKEND_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  deploy-backend-via-ssh:
    name: Deploy Backend To Server (Optional)
    runs-on: ubuntu-latest
    needs: build-and-push-backend-image
    steps:
      - name: Check deploy prerequisites
        id: prereq
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RATE_LIMIT_STORAGE_URI: ${{ secrets.RATE_LIMIT_STORAGE_URI }}
          FRONTEND_ORIGINS: ${{ secrets.FRONTEND_ORIGINS }}
        run: |
          # Compute lowercased image name for remote pulls
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}/requesting-approval' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$RATE_LIMIT_STORAGE_URI" ] && [ -n "$FRONTEND_ORIGINS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: missing one or more required secrets."
          fi

      - name: Deploy latest image on server
        if: steps.prereq.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ secrets.DEPLOY_GHCR_USER }} -p ${{ secrets.DEPLOY_GHCR_TOKEN }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            docker rm -f requesting-approval || true
            docker run -d --name requesting-approval --restart unless-stopped -p 5000:5000 \
              -e APP_ENV='production' \
              -e FLASK_DEBUG='false' \
              -e DEV_EMAIL='developer@devit.com' \
              -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              -e JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
              -e DB_HOST='${{ secrets.DB_HOST }}' \
              -e DB_USER='${{ secrets.DB_USER }}' \
              -e DB_PASS='${{ secrets.DB_PASS }}' \
              -e DB_NAME='${{ secrets.DB_NAME }}' \
              -e SESSION_COOKIE_SECURE='true' \
              -e RATE_LIMIT_STORAGE_URI='${{ secrets.RATE_LIMIT_STORAGE_URI }}' \
              -e FRONTEND_ORIGINS='${{ secrets.FRONTEND_ORIGINS }}' \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
