name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend-tests:
    name: Backend Tests (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      SECRET_KEY: test-secret-key
      SESSION_COOKIE_SECURE: "false"
      FLASK_DEBUG: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend directory
        id: detect-backend
        run: |
          # Prefer explicit backend folder names
          if [ -d RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval" >> "$GITHUB_ENV"
          elif [ -d requestingandapproval ]; then
            echo "BACKEND_DIR=requestingandapproval" >> "$GITHUB_ENV"
          elif [ -d RequestingAndApproval/RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval/RequestingAndApproval" >> "$GITHUB_ENV"
          else
            # Prefer directories that contain main.py specifically (avoid picking repo root with only requirements.txt)
            main_candidate=$(find . -maxdepth 4 -type f -name main.py -printf "%h\n" | sort -u | head -n1)
            if [ -n "$main_candidate" ]; then
              candidate=${main_candidate#./}
            else
              # Fallback: look for requirements/Dockerfile but avoid '.' unless it actually contains main.py
              candidate=$(find . -maxdepth 4 -type f \( -name requirements.txt -o -name Dockerfile \) -printf "%h\n" | sort -u | head -n1)
              candidate=${candidate#./}
              if [ "$candidate" = "" ] || [ "$candidate" = "." ]; then
                # Final fallback to the known folder name if present
                if [ -d RequestingAndApproval ]; then
                  candidate="RequestingAndApproval"
                elif [ -d requestingandapproval ]; then
                  candidate="requestingandapproval"
                else
                  candidate=""
                fi
              fi
            fi

            if [ -n "$candidate" ]; then
              echo "BACKEND_DIR=$candidate" >> "$GITHUB_ENV"
            else
              echo "No backend directory found" >&2
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}

      - name: "Debug: show backend dir and main module info"
        continue-on-error: true
        run: |
          echo "BACKEND_DIR=${BACKEND_DIR}"
          echo "PWD: $(pwd)"
          echo "Listing backend dir: ${BACKEND_DIR}"
          ls -la "${BACKEND_DIR}"
          echo "Python sys.path first entries:"
          python - <<'PY'
import sys, os, importlib
print('\n'.join(sys.path[:5]))
os.environ.pop('PYTHONPATH', None)
try:
    sys.path.insert(0, os.getcwd())
    m = importlib.import_module('main')
    print('main module file:', getattr(m, '__file__', 'N/A'))
    print('has validate_password_strength:', hasattr(m, 'validate_password_strength'))
    print('has inv_add:', hasattr(m, 'inv_add'))
except Exception as e:
    print('import main failed:', e)
    PY
  working-directory: ${{ env.BACKEND_DIR }}

      - name: Run pytest
        run: pytest -q
        working-directory: ${{ env.BACKEND_DIR }}

  security-scan:
    name: Security Scan (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend directory
        id: detect-backend-scan
        run: |
          if [ -d RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval" >> "$GITHUB_ENV"
          elif [ -d requestingandapproval ]; then
            echo "BACKEND_DIR=requestingandapproval" >> "$GITHUB_ENV"
          elif [ -d RequestingAndApproval/RequestingAndApproval ]; then
            echo "BACKEND_DIR=RequestingAndApproval/RequestingAndApproval" >> "$GITHUB_ENV"
          else
            main_candidate=$(find . -maxdepth 4 -type f -name main.py -printf "%h\n" | sort -u | head -n1)
            if [ -n "$main_candidate" ]; then
              candidate=${main_candidate#./}
            else
              candidate=$(find . -maxdepth 4 -type f \( -name requirements.txt -o -name Dockerfile \) -printf "%h\n" | sort -u | head -n1)
              candidate=${candidate#./}
              if [ "$candidate" = "" ] || [ "$candidate" = "." ]; then
                if [ -d RequestingAndApproval ]; then
                  candidate="RequestingAndApproval"
                elif [ -d requestingandapproval ]; then
                  candidate="requestingandapproval"
                else
                  candidate=""
                fi
              fi
            fi

            if [ -n "$candidate" ]; then
              echo "BACKEND_DIR=$candidate" >> "$GITHUB_ENV"
            else
              echo "No backend directory found" >&2
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Run dependency vulnerability audit
        run: pip-audit
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Run Bandit static security checks
        run: bandit -r . -x tests,moble,build
        working-directory: ${{ env.BACKEND_DIR }}
