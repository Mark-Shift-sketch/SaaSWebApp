name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend-tests:
    name: Backend Tests (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RequestingAndApproval
    env:
      SECRET_KEY: test-secret-key
      SESSION_COOKIE_SECURE: "false"
      FLASK_DEBUG: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  security-scan:
    name: Security Scan (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RequestingAndApproval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Run dependency vulnerability audit
        run: pip-audit

      - name: Run Bandit static security checks
        run: bandit -r . -x tests,moble,build
