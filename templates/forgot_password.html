<!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Forgot Password</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/login.css">
    </head>
    <body>
        <div class="page-shell">
            <div class="container">
                <aside class="logo-side">
                    <img class="panel-art" src="/static/replace.jpeg" alt="PHINMA COC campus artwork">
                    <div class="brand-content">
                        <img class="logo" src="/static/PHINMAEd_Logo.png" alt="PHINMA COC Logo">
                        <h1>PHINMA COC</h1>
                        <p class="campus">Cagayan de Oro College</p>
                        <div class="accent-line"></div>
                        <p class="portal">Finance Department Portal</p>
                    </div>
                    <p class="values">Excellence · Integrity · Professionalism</p>
                </aside>

                <section class="form-side">
                    <h2 class="title">Forgot Password</h2>
                    <p class="subtitle">Enter your email address to receive a reset link</p>
                    <div class="heading-line"></div>

                    {% if message %}
                        <p class="em" style="color: {% if success %}#0a7a2a{% else %}#c1121f{% endif %};">{{ message }}</p>
                    {% endif %}

                    <form action="/forgot-password" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <label for="email" class="field-label">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon">&#9993;</span>
                            <input id="email" type="email" name="email" placeholder="name@phinmaed.com" required>
                        </div>

                        <button type="submit">Send Reset Link</button>

                        <div class="sign">
                            <p>
                                Remembered your password?
                                <a href="{{ url_for('login') }}" class="a">Back to Login</a>
                            </p>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </body>
</html>
