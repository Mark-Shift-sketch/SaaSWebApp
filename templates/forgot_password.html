<!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Forgot Password</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/login.css">
    </head>
    <body>
        <div class="container">
            <div class="logo-side">
                <img class="logo" src="/static/PHINMAEd_Logo.png" alt="Logo">
                <h1>PHINMA COC</h1>
                <p>Cagayan de Oro College</p>
            </div>

            <div class="form-side">
                <p class="log">Forgot Password</p>

                {% if message %}
                    <p class="em" style="color: {% if success %}#0a7a2a{% else %}#c1121f{% endif %};">{{ message }}</p>
                {% endif %}

                <form action="/forgot-password" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <input type="email" name="email" placeholder="Email" required>

                    <button type="submit">Send Reset Link</button>

                    <div class="sign">
                        <p>
                            Remembered your password?
                            <a href="{{ url_for('login') }}" class="a">Back to Login</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
