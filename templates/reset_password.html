<!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Reset Password</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/login.css">
        <script src="/static/login.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="logo-side">
                <img class="logo" src="/static/PHINMAEd_Logo.png" alt="Logo">
                <h1>PHINMA COC</h1>
                <p>Cagayan de Oro College</p>
            </div>

            <div class="form-side">
                <p class="log">Reset Password</p>

                {% if message %}
                    <p class="em">{{ message }}</p>
                {% endif %}

                {% if token_valid %}
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="icon">
                        <input type="password" id="resetp" name="pass" placeholder="New Password" required>
                        <i id="rT" class="TP" onclick="TTP('resetp', 'rT')">
                            <img src="/static/eye.png" alt="show password">
                        </i>
                    </div>

                    <div class="icon">
                        <input type="password" id="resetcp" name="cpass" placeholder="Confirm Password" required>
                        <i id="rcT" class="TP" onclick="TTP('resetcp', 'rcT')">
                            <img src="/static/eye.png" alt="show password">
                        </i>
                    </div>

                    <button type="submit">Update Password</button>

                    <div class="sign">
                        <p>
                            Password rules: at least 6 chars, 1 uppercase, 1 digit.
                        </p>
                    </div>
                </form>
                {% else %}
                <div class="sign" style="text-align:left;">
                    <p>
                        <a href="/forgot-password" class="a">Request another reset link</a>
                    </p>
                    <p style="margin-top:10px;">
                        <a href="{{ url_for('login') }}" class="a">Back to Login</a>
                    </p>
                </div>
                {% endif %}
            </div>
        </div>
    </body>
</html>
