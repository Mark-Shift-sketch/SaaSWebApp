<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/login.css">
  <link rel="stylesheet" href="/static/signup.css">
    <script src="/static/login.js"></script>
</head>

<body class="signup-page
            <button type="button" id="verifyOtpBtn">Verify OTP</button>
          </div>
        </div>

        <p class="terms">By signing up, you agree to the Terms and Conditions of PHINMA COC</p>

        <button class="signup" id="signupBtn" type="submit" disabled>
          Create Account
        </button>

        <div class="sign">
          <p>
            Already have an account?
            <a href="{{ url_for('login') }}" class="a">Sign In</a>
          </p>
        </div>

        <p class="security-note">Secure · Protected · PHINMA Network</p>
      </form>
    </section>
  </div>
</div>

<script>
function getCsrfToken() {
  const el = document.querySelector('meta[name="csrf-token"]');
  return el ? el.getAttribute("content") : "";
}

function getOtpValue() {
  let otp = "";
  document.querySelectorAll(".Eotp").forEach((inp) => (otp += (inp.value || "").trim()));
  return otp;
}

function showSignupStatus(message, kind = "info") {
  let node = document.getElementById("signup-status-toast");
  if (!node) {
    node = document.createElement("div");
    node.id = "signup-status-toast";
    node.style.cssText = "position:fixed;top:16px;right:16px;z-index:99999;padding:10px 12px;border-radius:10px;color:#fff;max-width:340px;font-size:13px;box-shadow:0 10px 20px rgba(0,0,0,.2);";
    document.body.appendChild(node);
  }

  const bg = kind === "error" ? "#b91c1c" : kind === "success" ? "#15803d" : "#111827";
  node.style.background = bg;
  node.textContent = message;
  node.style.display = "block";
  setTimeout(() => {
    if (node) node.style.display = "none";
  }, 3000);
}

function setupOtpInputs() {
  const inputs = Array.from(document.querySelectorAll(".Eotp"));
  if (!inputs.length) return;

  inputs.forEach((inp, idx) => {
    inp.addEventListener("input", () => {
      inp.value = (inp.value || "").replace(/\D/g, "").slice(0, 1);
      if (inp.value && inputs[idx + 1]) inputs[idx + 1].focus();
    });

    inp.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !inp.value && inputs[idx - 1]) {
        inputs[idx - 1].focus();
      }
      if (e.key === "ArrowLeft" && inputs[idx - 1]) inputs[idx - 1].focus();
      if (e.key === "ArrowRight" && inputs[idx + 1]) inputs[idx + 1].focus();
      if (e.key === "Enter") document.getElementById("verifyOtpBtn")?.click();
    });

    inp.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text") || "";
      const digits = text.replace(/\D/g, "").slice(0, inputs.length);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach((d, i) => {
        if (inputs[i]) inputs[i].value = d;
      });
      const last = inputs[Math.min(digits.length, inputs.length) - 1];
      if (last) last.focus();
    });
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const REQUIRED_EMAIL_DOMAIN = "@phinmaed.com";
  const DOMAIN_HELPER_MESSAGE = "Please use youre phinmaed email";
  const getOtpBtn = document.getElementById("getOtpBtn");
  const verifyOtpBtn = document.getElementById("verifyOtpBtn");
  const overlay = document.getElementById("overlay");
  const signupBtn = document.getElementById("signupBtn");
  const signupForm = document.querySelector('form[action="/signup"]');
  const emailEl = document.getElementById("email");
  const companyEl = document.getElementById("company_slug");
  const deptEl = document.getElementById("dept");
  const otpCountdownEl = document.getElementById("otpCountdown");
  const loginLink = document.querySelector('a[href*="login"]');
  let otpCountdownTimer = null;
  let otpSecondsRemaining = 0;

  setupOtpInputs();

  function isAllowedDomainEmail(value) {
    const normalized = String(value || "").trim().toLowerCase();
    return normalized.endsWith(REQUIRED_EMAIL_DOMAIN) && normalized.length > REQUIRED_EMAIL_DOMAIN.length;
  }

  function ensureAllowedDomainEmail(showMessage = true) {
    const email = (emailEl?.value || "").trim();
    if (!email) {
      return false;
    }
    if (isAllowedDomainEmail(email)) {
      if (emailEl) emailEl.setCustomValidity("");
      return true;
    }
    if (emailEl) emailEl.setCustomValidity(DOMAIN_HELPER_MESSAGE);
    if (showMessage) showSignupStatus(DOMAIN_HELPER_MESSAGE, "error");
    return false;
  }

  if (emailEl) {
    emailEl.addEventListener("input", () => {
      if (isAllowedDomainEmail(emailEl.value)) {
        emailEl.setCustomValidity("");
      }
    });
  }


  function showOverlay() {
    overlay.style.display = "flex";
    const first = document.querySelector(".Eotp");
    if (first) first.focus();
  }

  function hideOverlay() {
    overlay.style.display = "none";
  }

  if (overlay) {
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) hideOverlay();
    });
  }

  function setDeptOptions(departments, keepSelected = "") {
    if (!deptEl) return;
    const previous = keepSelected || deptEl.value || "";
    deptEl.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select Department";
    deptEl.appendChild(placeholder);

    (departments || []).forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if (previous && previous === name) {
        opt.selected = true;
      }
      deptEl.appendChild(opt);
    });
  }

  async function refreshDepartmentsForCompany() {
    if (!companyEl || !deptEl) return;

    const companySlug = (companyEl.value || "").trim();
    if (!companySlug) {
      setDeptOptions([]);
      return;
    }

    try {
      deptEl.disabled = true;
      const res = await fetch(`/api/mobile/departments?company_slug=${encodeURIComponent(companySlug)}`, {
        method: "GET",
        credentials: "same-origin",
      });

      if (!res.ok) {
        throw new Error(`Failed to load departments (${res.status})`);
      }

      const data = await res.json();
      setDeptOptions(data?.departments || []);
    } catch (err) {
      showSignupStatus(String(err || "Failed to load departments"), "error");
      setDeptOptions([]);
    } finally {
      deptEl.disabled = false;
    }
  }

  if (companyEl) {
    companyEl.addEventListener("change", refreshDepartmentsForCompany);
  }

  function parseOtpCooldownSeconds(message) {
    const msg = String(message || "");
    const matched = msg.match(/please\s+wait\s+(\d+)\s+seconds?/i);
    return matched ? parseInt(matched[1], 10) : 0;
  }

  function renderOtpCountdown() {
    if (!otpCountdownEl) return;
    if (otpSecondsRemaining > 0) {
      otpCountdownEl.textContent = `Resend in ${otpSecondsRemaining}s`;
      otpCountdownEl.style.display = "inline";
      return;
    }
    otpCountdownEl.textContent = "";
    otpCountdownEl.style.display = "none";
  }

  function startOtpCountdown(seconds) {
    const normalized = Number(seconds);
    otpSecondsRemaining = Number.isFinite(normalized) ? Math.max(0, Math.floor(normalized)) : 0;

    if (otpCountdownTimer) {
      clearInterval(otpCountdownTimer);
      otpCountdownTimer = null;
    }

    renderOtpCountdown();

    if (otpSecondsRemaining <= 0) {
      if (getOtpBtn) getOtpBtn.disabled = false;
      return;
    }

    if (getOtpBtn) getOtpBtn.disabled = true;
    otpCountdownTimer = setInterval(() => {
      otpSecondsRemaining = Math.max(0, otpSecondsRemaining - 1);
      renderOtpCountdown();
      if (otpSecondsRemaining <= 0) {
        clearInterval(otpCountdownTimer);
        otpCountdownTimer = null;
        if (getOtpBtn) getOtpBtn.disabled = false;
      }
    }, 1000);
  }

  if (getOtpBtn) {
    getOtpBtn.addEventListener("click", async () => {
      if (otpSecondsRemaining > 0) {
        showSignupStatus(`Please wait ${otpSecondsRemaining} seconds before resending`, "error");
        return;
      }

      const email = (emailEl?.value || "").trim();
      if (!email) return showSignupStatus("Enter email first", "error");
      if (!ensureAllowedDomainEmail()) return;

      try {
        getOtpBtn.disabled = true;

        const res = await fetch("/send-otp", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCsrfToken(),
          },
          body: new URLSearchParams({ email }),
        });

        const msg = await res.text();
        const cooldownSeconds = parseOtpCooldownSeconds(msg);

        if (!res.ok) {
          showSignupStatus(msg || `Request failed (${res.status})`, "error");
          if (cooldownSeconds > 0) startOtpCountdown(cooldownSeconds);
          return;
        }

        showSignupStatus(msg || "OTP request sent.", "success");
        if (cooldownSeconds > 0) startOtpCountdown(cooldownSeconds);

        if (msg.toLowerCase().includes("otp sent") || msg.toLowerCase().includes("success")) {
          showOverlay();
        }
      } catch (err) {
        showSignupStatus("Network error: " + err, "error");
      } finally {
        if (otpSecondsRemaining <= 0) getOtpBtn.disabled = false;
      }
    });
  }

  if (verifyOtpBtn) {
    verifyOtpBtn.addEventListener("click", async () => {
      const email = (emailEl?.value || "").trim();
      const otp = getOtpValue();

      if (!email) return showSignupStatus("Enter email first", "error");
      if (!ensureAllowedDomainEmail()) return;
      if (otp.length !== 6) return showSignupStatus("Enter 6-digit OTP", "error");

      try {
        verifyOtpBtn.disabled = true;

        const res = await fetch("/verify", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCsrfToken(),
          },
          body: new URLSearchParams({ email, otp }),
        });

        const msg = await res.text();

        if (!res.ok) {
          showSignupStatus(msg || `Verify failed (${res.status})`, "error");
          return;
        }

        showSignupStatus(msg || "OTP verified.", "success");

        if (msg.toLowerCase().includes("verified")) {
          hideOverlay();
          signupBtn.disabled = false;
        }
      } catch (err) {
        showSignupStatus("Network error: " + err, "error");
      } finally {
        verifyOtpBtn.disabled = false;
      }
    });
  }

  if (companyEl?.value) {
    refreshDepartmentsForCompany();
  }

  if (signupForm) {
    signupForm.addEventListener("submit", (event) => {
      const email = (emailEl?.value || "").trim();
      if (!email) return;
      if (!ensureAllowedDomainEmail()) {
        event.preventDefault();
        emailEl?.focus();
      }
    });
  }
});
</script>
</body>
</html>
